name: CI + Release Build

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  PACKAGE_NAME: ModList-Weaver

jobs:
  # ====== 1) 单元测试（纯逻辑，无网络） ======
  test:
    name: 单元测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: 运行 pytest
        shell: bash
        run: python -m pytest tests -v --tb=short

  # ====== 2) Windows PyInstaller 打包（仅 tags / main / master push） ======
  build-windows:
    name: Windows 打包 + 上传 Release
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖（含 PyInstaller）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywin32-ctypes

      - name: 运行测试
        shell: bash
        run: python -m pytest tests -v --tb=short

      - name: PyInstaller 构建
        run: pyinstaller build.spec

      - name: 压缩打包产物（zip）
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "latest" }
          $ZipName = "${env:PACKAGE_NAME}-Windows-$Version.zip"
          Compress-Archive -Path "dist/${env:PACKAGE_NAME}/*" -DestinationPath $ZipName -Force
          "ZIP_NAME=$ZipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 上传构建工件（Actions Artifact，每次都传）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-Windows-${{ github.ref_name }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: 生成 Release 描述（合并本次更新内容）
        shell: bash
        run: |
          python - <<'PY'
          from backend.api import CHANGELOG, APP_TITLE
          tag = "${{ github.ref_name }}"
          out = []
          try:
              ver = tag[1:] if tag.startswith("v") else tag
              entry = next((c for c in CHANGELOG if c["version"] == ver), None)
              out.append(f"## {APP_TITLE} {tag}")
              out.append("")
              if entry:
                  if entry.get("date"):
                      out.append(f"**发布时间**：{entry['date']}")
                  if entry.get("title"):
                      out.append(f"**主题**：{entry['title']}")
                  out.append("")
                  out.append("### 本次更新")
                  out.append("")
                  out.extend(f"- {i}" for i in (entry.get("items") or []))
              else:
                  out.append("### 本次更新")
                  out.append("")
                  out.append("- 未找到对应版本的软件内更新日志，请查看提交记录。")
          except Exception:
              out = [f"## {APP_TITLE} {tag}", "", "（未能生成本次更新说明，请查看提交记录。）"]
          out.extend([
              "", "---", "",
              "### 自动构建产物",
              "Windows x64 单目录版（PyInstaller COLLECT 模式，含内嵌 WebView + Python 运行时）。",
              "", "### 使用方法",
              "1. 解压压缩包到任意目录",
              f"2. 双击运行 `{APP_TITLE}.exe`",
              "3. 首次运行会初始化缓存文件，首次启动稍慢",
              "", "> 本版本 CI 通过：单元测试（Windows × Ubuntu × 3 个 Python 版本矩阵） ✅",
          ])
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          PY

      - name: 上传到 GitHub Release（仅当打了 v* tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          body_path: release_body.md
          generate_release_notes: true
          update_existing_release: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
